<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540"><rect width="800" height="540" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">B/D组 · 四轮共面检查 与 静态载荷称重</text><text x="776" y="34" font-size="13" fill="#6b7280" text-anchor="end" font-family="Noto Sans SC">对应清单条目 #20 – #22、#56 – #58</text><line x1="24.0" y1="46.0" x2="776.0" y2="46.0" stroke="#e5e7eb" stroke-width="1.5"/><text x="40" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">① 四轮接地点是否共面（侧视，示意放大）</text><line x1="40.0" y1="360.0" x2="360.0" y2="360.0" stroke="#334155" stroke-width="3"/><text x="46" y="382" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">平板（玻璃/大理石台面）</text><g transform="translate(210.0,298.0) rotate(-4)"><rect x="-125.0" y="-38.0" width="250.0" height="40.0" fill="#f1f5f9" stroke="#334155" stroke-width="2" rx="6"/></g><circle cx="120.0" cy="324.0" r="26.0" fill="#f8fafc" stroke="#334155" stroke-width="2"/><circle cx="300.0" cy="334.0" r="26.0" fill="#f8fafc" stroke="#334155" stroke-width="2"/><polygon points="120.0,352.0 120.0,360.0 111.0,360.0" fill="#dc2626"/><text x="148" y="380" font-size="12" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC">红楔 = 塞尺</text><line x1="196.0" y1="150.0" x2="131.9" y2="281.9" stroke="#dc2626" stroke-width="1.8"/><polygon points="128.0,290.0 135.5,283.7 128.3,280.2" fill="#dc2626"/><text x="202" y="146" font-size="13" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC">一角垫起后量</text><text x="40" y="412" font-size="13" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">四角轮流塞入，间隙 ≤1 mm 合格；对角垫起量另一角变化 = 扭转刚度。</text><text x="430" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">② 四轮静态载荷（俯视）</text><rect x="470.0" y="110.0" width="240.0" height="240.0" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><rect x="473.0" y="120.0" width="24.0" height="80.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="476.0" y1="137.0" x2="494.0" y2="153.0" stroke="#334155" stroke-width="1.3"/><line x1="476.0" y1="152.0" x2="494.0" y2="168.0" stroke="#334155" stroke-width="1.3"/><line x1="476.0" y1="167.0" x2="494.0" y2="183.0" stroke="#334155" stroke-width="1.3"/><circle cx="485.0" cy="160.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><rect x="461.0" y="194.0" width="48.0" height="26.0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2" rx="3"/><text x="485" y="211" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC">N1</text><rect x="683.0" y="120.0" width="24.0" height="80.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="686.0" y1="153.0" x2="704.0" y2="137.0" stroke="#334155" stroke-width="1.3"/><line x1="686.0" y1="168.0" x2="704.0" y2="152.0" stroke="#334155" stroke-width="1.3"/><line x1="686.0" y1="183.0" x2="704.0" y2="167.0" stroke="#334155" stroke-width="1.3"/><circle cx="695.0" cy="160.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><rect x="671.0" y="194.0" width="48.0" height="26.0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2" rx="3"/><text x="695" y="211" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC">N2</text><rect x="473.0" y="260.0" width="24.0" height="80.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="476.0" y1="293.0" x2="494.0" y2="277.0" stroke="#334155" stroke-width="1.3"/><line x1="476.0" y1="308.0" x2="494.0" y2="292.0" stroke="#334155" stroke-width="1.3"/><line x1="476.0" y1="323.0" x2="494.0" y2="307.0" stroke="#334155" stroke-width="1.3"/><circle cx="485.0" cy="300.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><rect x="461.0" y="334.0" width="48.0" height="26.0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2" rx="3"/><text x="485" y="351" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC">N3</text><rect x="683.0" y="260.0" width="24.0" height="80.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="686.0" y1="277.0" x2="704.0" y2="293.0" stroke="#334155" stroke-width="1.3"/><line x1="686.0" y1="292.0" x2="704.0" y2="308.0" stroke="#334155" stroke-width="1.3"/><line x1="686.0" y1="307.0" x2="704.0" y2="323.0" stroke="#334155" stroke-width="1.3"/><circle cx="695.0" cy="300.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><rect x="671.0" y="334.0" width="48.0" height="26.0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2" rx="3"/><text x="695" y="351" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC">N4</text><text x="590" y="250" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">每个轮子下垫电子秤</text><rect x="24.0" y="436.0" width="752.0" height="68.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="36" y="464" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">车上放常态载重、摆正常使用姿态再称。分配比 = N_i / (N1+N2+N3+N4)；不平衡度 = (最大−最小)/平均 ≤ 5%。</text><text x="36" y="486" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">载荷比就是质心位置的「实测验证」：后轮偏重 = 质心靠后，与 D 组计算结果互相校验。</text></svg>