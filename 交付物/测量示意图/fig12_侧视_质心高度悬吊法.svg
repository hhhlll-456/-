<svg xmlns="http://www.w3.org/2000/svg" width="800" height="545" viewBox="0 0 800 545"><rect width="800" height="545" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">D组 · 质心高度：双线悬吊法（侧视）</text><text x="776" y="34" font-size="13" fill="#6b7280" text-anchor="end" font-family="Noto Sans SC">对应清单条目 #55</text><line x1="24.0" y1="46.0" x2="776.0" y2="46.0" stroke="#e5e7eb" stroke-width="1.5"/><rect x="120.0" y="64.0" width="560.0" height="14.0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="120" y="54" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">横梁</text><line x1="240.0" y1="78.0" x2="240.0" y2="220.0" stroke="#334155" stroke-width="2"/><circle cx="240.0" cy="222.0" r="5.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><g transform="translate(240.0,226.0) rotate(-9)"><rect x="-150.0" y="-8.0" width="230.0" height="64.0" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="6"/></g><g transform="translate(122.0,296.0) rotate(-9)"><circle cx="0.0" cy="0.0" r="22.0" fill="#ffffff" stroke="#334155" stroke-width="2"/></g><g transform="translate(58.0,300.0) rotate(-9)"><circle cx="0.0" cy="0.0" r="22.0" fill="#ffffff" stroke="#334155" stroke-width="2"/></g><line x1="240.0" y1="78.0" x2="240.0" y2="420.0" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="250" y="410" font-size="13" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">垂线1（沿绳延长画在车侧面）</text><line x1="560.0" y1="78.0" x2="560.0" y2="220.0" stroke="#334155" stroke-width="2"/><circle cx="560.0" cy="222.0" r="5.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><g transform="translate(560.0,226.0) rotate(9)"><rect x="-80.0" y="-8.0" width="230.0" height="64.0" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="6"/></g><g transform="translate(678.0,296.0) rotate(9)"><circle cx="0.0" cy="0.0" r="22.0" fill="#ffffff" stroke="#334155" stroke-width="2"/></g><g transform="translate(742.0,300.0) rotate(9)"><circle cx="0.0" cy="0.0" r="22.0" fill="#ffffff" stroke="#334155" stroke-width="2"/></g><line x1="560.0" y1="78.0" x2="560.0" y2="420.0" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="548" y="410" font-size="13" fill="#16a34a" text-anchor="end" font-family="Noto Sans SC">垂线2</text><rect x="24.0" y="436.0" width="752.0" height="90.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="36" y="464" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">步骤：① 从吊点A吊起小车让其自然下垂，把绳的延长线画/拍在车侧面上；② 换吊点B重复；</text><text x="36" y="486" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">③ 两条垂线的交点就是质心在竖直平面内的投影（★）；④ 换车的另一侧再做一次得到另一平面投影，即可得 z_c。</text><text x="36" y="508" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">拍照后按照片比例换算（画面里放一把钢尺作比例尺），精度 ±3 mm。</text></svg>