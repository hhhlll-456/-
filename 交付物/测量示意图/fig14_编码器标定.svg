<svg xmlns="http://www.w3.org/2000/svg" width="800" height="575" viewBox="0 0 800 575"><rect width="800" height="575" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">F组 · 编码器：单圈计数 与 每米计数标定</text><text x="776" y="34" font-size="13" fill="#6b7280" text-anchor="end" font-family="Noto Sans SC">对应清单条目 #75 – #86</text><line x1="24.0" y1="46.0" x2="776.0" y2="46.0" stroke="#e5e7eb" stroke-width="1.5"/><text x="40" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">① 编码器装在哪根轴？</text><circle cx="78.0" cy="250.0" r="24.0" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="78" y="296" font-size="12" fill="#2563eb" text-anchor="middle" font-family="Noto Sans SC">编码器</text><rect x="102.0" y="210.0" width="120.0" height="80.0" fill="#dbeafe" stroke="#334155" stroke-width="2" rx="16"/><text x="162" y="196" font-size="12" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">电机转子</text><rect x="222.0" y="220.0" width="70.0" height="60.0" fill="#e5e7eb" stroke="#334155" stroke-width="1.5"/><text x="257" y="300" font-size="12" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">减速箱</text><rect x="292.0" y="242.0" width="50.0" height="16.0" fill="#334155" stroke="#334155" stroke-width="1"/><text x="317" y="278" font-size="12" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">输出轴→轮</text><text x="40" y="330" font-size="13" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">PPR（单相线数，常见11/13）查手册；计数倍频 1x/2x/4x 按你代码实际写。</text><text x="430" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">② 手转 1 整圈 → C_1rev</text><circle cx="520.0" cy="170.0" r="45.0" fill="#f8fafc" stroke="#334155" stroke-width="2"/><circle cx="520.0" cy="170.0" r="14.0" fill="#e5e7eb" stroke="#334155" stroke-width="1.5"/><line x1="520.0" y1="108.0" x2="530.8" y2="108.9" stroke="#dc262