<svg xmlns="http://www.w3.org/2000/svg" width="800" height="555" viewBox="0 0 800 555"><rect width="800" height="555" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">E组 · 电机铭牌 / PWM 死区与线性度</text><text x="776" y="34" font-size="13" fill="#6b7280" text-anchor="end" font-family="Noto Sans SC">对应清单条目 #62 – #74</text><line x1="24.0" y1="46.0" x2="776.0" y2="46.0" stroke="#e5e7eb" stroke-width="1.5"/><text x="40" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">电机与铭牌</text><rect x="70.0" y="180.0" width="150.0" height="100.0" fill="#dbeafe" stroke="#334155" stroke-width="2" rx="20"/><rect x="220.0" y="214.0" width="60.0" height="32.0" fill="#e5e7eb" stroke="#334155" stroke-width="1.5"/><text x="250" y="206" font-size="12" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">减速箱</text><rect x="280.0" y="222.0" width="56.0" height="16.0" fill="#334155" stroke="#334155" stroke-width="1"/><text x="308" y="260" font-size="12" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">输出轴(量直径)</text><rect x="95.0" y="205.0" width="100.0" height="50.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.6" rx="4"/><text x="145" y="226" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC">铭牌：型号 / 电压</text><text x="145" y="244" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC">减速比 i（如1:48）</text><text x="70" y="320" font-size="13" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">拍铭牌照片；空载转速查手册或悬空全速实测；堵转转矩等查手册。</text><text x="500" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">PWM 占空比 → 转速（四轮分别测）</text><line x1="470.0" y1="410.0" x2="470.0" y2="149.0" stroke="#1f2937" stroke-width="2"/><polygon points="470.0,140.0 466.0,149.0 474.0,149.0" fill="#1f2937"/><text x="470" y="130" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC">转速 rpm</text><line x1="470.0" y1="410.0" x2="761.0" y2="410.0" stroke="#1f2937" stroke-width="2"/><polygon points="770.0,410.0 761.0,406.0 761.0,414.0" fill="#1f2937"/><text x="770" y="452" font-size="13" fill="#1f2937" text-anchor="end" font-family="Noto Sans SC">PWM 占空比 %</text><line x1="522.0" y1="410.0" x2="522.0" y2="404.0" stroke="#6b7280" stroke-width="1.2"/><text x="522.0" y="430" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">20%</text><line x1="574.0" y1="410.0" x2="574.0" y2="404.0" stroke="#6b7280" stroke-width="1.2"/><text x="574.0" y="430" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">40%</text><line x1="626.0" y1="410.0" x2="626.0" y2="404.0" stroke="#6b7280" stroke-width="1.2"/><text x="626.0" y="430" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">60%</text><line x1="678.0" y1="410.0" x2="678.0" y2="404.0" stroke="#6b7280" stroke-width="1.2"/><text x="678.0" y="430" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">80%</text><line x1="730.0" y1="410.0" x2="730.0" y2="404.0" stroke="#6b7280" stroke-width="1.2"/><text x="730.0" y="430" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">100%</text><rect x="470.0" y="405.0" width="62.0" height="5.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="501" y="448" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC">死区 DZ</text><line x1="470.0" y1="410.0" x2="522.0" y2="410.0" stroke="#2563eb" stroke-width="2.5"/><line x1="522.0" y1="410.0" x2="574.0" y2="350.0" stroke="#2563eb" stroke-width="2.5"/><line x1="574.0" y1="350.0" x2="626.0" y2="290.0" stroke="#2563eb" stroke-width="2.5"/><line x1="626.0" y1="290.0" x2="678.0" y2="230.0" stroke="#2563eb" stroke-width="2.5"/><line x1="678.0" y1="230.0" x2="730.0" y2="170.0" stroke="#2563eb" stroke-width="2.5"/><circle cx="574.0" cy="350.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><circle cx="626.0" cy="290.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><circle cx="678.0" cy="230.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><circle cx="730.0" cy="170.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="600" y="250" font-size="13" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">同一占空比下四轮转速差 Δn</text><rect x="24.0" y="470.0" width="752.0" height="68.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="36" y="498" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">死区：占空比从 0 缓慢上调，记下四个轮子各自开始转动的最小值（±1%），这是「各轮死区补偿」的来源。</text><text x="36" y="520" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">在 20/40/60/80/100% 五个点读四轮转速：既得线性度，又得四轮一致性 Δn，还顺便完成 k_i 标定的数据采集。</text></svg>