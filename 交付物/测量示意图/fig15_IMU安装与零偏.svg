"/><circle cx="85.0" cy="340.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><rect x="326.0" y="312.0" width="18.0" height="56.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="329.0" y1="317.0" x2="341.0" y2="333.0" stroke="#334155" stroke-width="1.3"/><line x1="329.0" y1="332.0" x2="341.0" y2="348.0" stroke="#334155" stroke-width="1.3"/><line x1="329.0" y1="347.0" x2="341.0" y2="363.0" stroke="#334155" stroke-width="1.3"/><circle cx="335.0" cy="340.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><line x1="210.0" y1="250.0" x2="210.0" y2="149.0" stroke="#2563eb" stroke-width="2"/><polygon points="210.0,140.0 206.0,149.0 214.0,149.0" fill="#2563eb"/><text x="216" y="152" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">车体 X</text><rect x="280.0" y="190.0" width="60.0" height="40.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><line x1="310.0" y1="212.0" x2="321.3" y2="176.6" stroke="#16a34a" stroke-width="2"/><polygon points="324.0,168.0 317.5,175.4 325.1,177.8" fill="#16a34a"/><text x="300" y="176" font-size="13" fill="#16a34a" text-anchor="end" font-weight="bold" font-family="Noto Sans SC">IMU 的X轴</text><text x="258" y="206" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">θ ≤ 1°</text><text x="310" y="258" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">量安装坐标 (x,y)</text><text x="40" y="416" font-size="13" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">手动把车转 90°，检查输出符号与车体坐标系是否一致（±90°/±180° 对得上）。</text><text x="430" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">② 静态零偏：静置 60 s</text><line x1="470.0" y1="420.0" x2="470.0" y2="189.0" stroke="#1f2937" stroke-width="2"/><polygon points="470.0,180.0 466.0,189.0 474.0,189.0" fill="#1f2937"/><text x="470" y="170" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC">角度 °</text><line x1="470.0" y1="420.0" x2="761.0" y2="420.0" stroke="#1f2937" stroke-width="2"/><polygon points="770.0,420.0 761.0,416.0 761.0,424.0" fill="#1f2937"/><text x="770" y="464" font-size="13" fill="#1f2937" text-anchor="end" font-family="Noto Sans SC">时间 s</text><line x1="470.0" y1="420.0" x2="470.0" y2="414.0" stroke="#6b7280" stroke-width="1.2"/><text x="470.0" y="440" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">0</text><line x1="562.0" y1="420.0" x2="562.0" y2="414.0" stroke="#6b7280" stroke-width="1.2"/><text x="562.0" y="440" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">20</text><line x1="654.0" y1="420.0" x2="654.0" y2="414.0" stroke="#6b7280" stroke-width="1.2"/><text x="654.0" y="440" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">40</text><line x1="746.0" y1="420.0" x2="746.0" y2="414.0" stroke="#6b7280" stroke-width="1.2"/><text x="746.0" y="440" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">60</text><line x1="470.0" y1="332.2" x2="493.0" y2="326.1" stroke="#2563eb" stroke-width="2"/><line x1="493.0" y1="326.1" x2="516.0" y2="328.7" stroke="#2563eb" stroke-width="2"/><line x1="516.0" y1="328.7" x2="539.0" y2="322.6" stroke="#2563eb" stroke-width="2"/><line x1="539.0" y1="322.6" x2="562.0" y2="325.2" stroke="#2563eb" stroke-width="2"/><line x1="562.0" y1="325.2" x2="585.0" y2="319.1" stroke="#2563eb" stroke-width="2"/><line x1="585.0" y1="319.1" x2="608.0" y2="321.7" stroke="#2563eb" stroke-width="2"/><line x1="608.0" y1="321.7" x2="631.0" y2="315.6" stroke="#2563eb" stroke-width="2"/><line x1="631.0" y1="315.6" x2="654.0" y2="318.2" stroke="#2563eb" stroke-width="2"/><line x1="654.0" y1="318.2" x2="677.0" y2="312.1" stroke="#2563eb" stroke-width="2"/><line x1="677.0" y1="312.1" x2="700.0" y2="314.7" stroke="#2563eb" stroke-width="2"/><line x1="700.0" y1="314.7" x2="723.0" y2="308.6" stroke="#2563eb" stroke-width="2"/><line x1="723.0" y1="308.6" x2="746.0" y2="311.2" stroke="#2563eb" stroke-width="2"/><line x1="470.0" y1="330.0" x2="770.0" y2="330.0" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/><text x="700" y="344" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Noto Sans SC">初始零点</text><line x1="620.0" y1="330.0" x2="620.0" y2="318.0" stroke="#dc2626" stroke-width="1.8"/><polygon points="620.0,309.0 616.0,318.0 624.0,318.0" fill="#dc2626"/><text x="630" y="314" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">60s 漂移量</text><rect x="24.0" y="486.0" width="752.0" height="90.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="36" y="514" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">零偏测试：上电静置 1~2 s 后开始记录，静止 60 s 内角度变化即漂移；角速度输出平均值即零偏（±0.5°/s）。</text><text x="36" y="536" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">GY-25T 无磁力计，航向靠陀螺积分、随时间漂移——长时间任务要有归零/重标定策略。</text><text x="36" y="558" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">接口（TTL 串口或 I2C）、波特率、输出帧格式、数据率：拍丝印 + 查手册一并记录。</text></svg>