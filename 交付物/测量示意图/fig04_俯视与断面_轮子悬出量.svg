oke-width="1.3"/><circle cx="140.0" cy="236.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><rect x="358.0" y="201.0" width="24.0" height="70.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="361.0" y1="213.0" x2="379.0" y2="229.0" stroke="#334155" stroke-width="1.3"/><line x1="361.0" y1="228.0" x2="379.0" y2="244.0" stroke="#334155" stroke-width="1.3"/><line x1="361.0" y1="243.0" x2="379.0" y2="259.0" stroke="#334155" stroke-width="1.3"/><circle cx="370.0" cy="236.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><line x1="370.0" y1="88.0" x2="370.0" y2="286.0" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="378" y="100" font-size="13" fill="#dc2626" text-anchor="start" font-family="Noto Sans SC">断面 A–A（过右轮轴心）</text><text x="30" y="316" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">② 在断面 A–A 上量（从车前方看过去的截面）</text><rect x="80.0" y="346.0" width="300.0" height="70.0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="90" y="338" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">车体（该断面处的侧边缘）</text><rect x="412.0" y="330.0" width="26.0" height="100.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="4"/><text x="425" y="452" font-size="12" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">轮子（宽=轮厚 t）</text><line x1="380.0" y1="346.0" x2="380.0" y2="478.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><line x1="412.0" y1="430.0" x2="412.0" y2="478.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><line x1="380.0" y1="470.0" x2="403.0" y2="470.0" stroke="#16a34a" stroke-width="1.6"/><polygon points="412.0,470.0 403.0,466.0 403.0,474.0" fill="#16a34a"/><line x1="412.0" y1="470.0" x2="389.0" y2="470.0" stroke="#16a34a" stroke-width="1.6"/><polygon points="380.0,470.0 389.0,474.0 389.0,466.0" fill="#16a34a"/><text x="396.0" y="463" font-size="13" fill="#16a34a" text-anchor="middle" font-family="Noto Sans SC">悬出量 s</text><rect x="455.0" y="356.0" width="115.0" height="50.0" fill="none" stroke="#dc2626" stroke-width="1.5" rx="4"/><text x="512" y="348" font-size="12" fill="#dc2626" text-anchor="middle" font-family="Noto Sans SC">车体其他更宽的部位</text><line x1="455.0" y1="352.0" x2="500.0" y2="336.0" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/><text x="512" y="330" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC">× 不要量到这里</text><rect x="24.0" y="502.0" width="752.0" height="90.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="36" y="530" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">答案：量「过轮心的断面 A–A 处」的车体边缘 → 轮子最外点，不是量到全车最宽处！只有当车体是规则矩形、</text><text x="36" y="552" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">轮子恰好在最宽断面上时，两种量法才恰好相等。尺子必须垂直于车体侧边（横向量），不要斜量。</text><text x="36" y="574" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">轮子缩进车体内时记负值。校核式：车体总宽 = 车体本体宽 + 左悬出量 + 右悬出量。</text></svg>