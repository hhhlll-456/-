<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">D组 · 质量分布与质心计算（俯视）</text><text x="776" y="34" font-size="13" fill="#6b7280" text-anchor="end" font-family="Noto Sans SC">对应清单条目 #41 – #54、#59 – #61</text><line x1="24.0" y1="46.0" x2="776.0" y2="46.0" stroke="#e5e7eb" stroke-width="1.5"/><rect x="150.0" y="110.0" width="300.0" height="300.0" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><rect x="155.0" y="128.0" width="20.0" height="64.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="158.0" y1="137.0" x2="172.0" y2="153.0" stroke="#334155" stroke-width="1.3"/><line x1="158.0" y1="152.0" x2="172.0" y2="168.0" stroke="#334155" stroke-width="1.3"/><line x1="158.0" y1="167.0" x2="172.0" y2="183.0" stroke="#334155" stroke-width="1.3"/><circle cx="165.0" cy="160.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><text x="165" y="120" font-size="11" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">m_m</text><rect x="425.0" y="128.0" width="20.0" height="64.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="428.0" y1="153.0" x2="442.0" y2="137.0" stroke="#334155" stroke-width="1.3"/><line x1="428.0" y1="168.0" x2="442.0" y2="152.0" stroke="#334155" stroke-width="1.3"/><line x1="428.0" y1="183.0" x2="442.0" y2="167.0" stroke="#334155" stroke-width="1.3"/><circle cx="435.0" cy="160.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><text x="435" y="120" font-size="11" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">m_m</text><rect x="155.0" y="328.0" width="20.0" height="64.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="158.0" y1="353.0" x2="172.0" y2="337.0" stroke="#334155" stroke-width="1.3"/><line x1="158.0" y1="368.0" x2="172.0" y2="352.0" stroke="#334155" stroke-width="1.3"/><line x1="158.0" y1="383.0" x2="172.0" y2="367.0" stroke="#334155" stroke-width="1.3"/><circle cx="165.0" cy="360.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><text x="165" y="320" font-size="11" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">m_m</text><rect x="425.0" y="328.0" width="20.0" height="64.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="428.0" y1="337.0" x2="442.0" y2="353.0" stroke="#334155" stroke-width="1.3"/><line x1="428.0" y1="352.0" x2="442.0" y2="368.0" stroke="#334155" stroke-width="1.3"/><line x1="428.0" y1="367.0" x2="442.0" y2="383.0" stroke="#334155" stroke-width="1.3"/><circle cx="435.0" cy="360.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><text x="435" y="320" font-size="11" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">m_m</text><rect x="230.0" y="150.0" width="140.0" height="50.0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="300" y="180" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC">电池 m_b</text><rect x="240.0" y="300.0" width="120.0" height="44.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="300" y="327" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Noto Sans SC">主控+驱动 m_c</text><line x1="300.0" y1="250.0" x2="300.0" y2="129.0" stroke="#2563eb" stroke-width="1.6"/><polygon points="300.0,120.0 296.0,129.0 304.0,129.0" fill="#2563eb"/><text x="306" y="132" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">X</text><line x1="300.0" y1="250.0" x2="199.0" y2="250.0" stroke="#2563eb" stroke-width="1.6"/><polygon points="190.0,250.0 199.0,254.0 199.0,246.0" fill="#2563eb"/><text x="198" y="242" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">Y</text><circle cx="300.0" cy="250.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="308" y="268" font-size="12" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">原点(0,0)</text><rect x="520.0" y="110.0" width="250.0" height="220.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="536" y="140" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">逐件称重 + 量坐标：</text><text x="536" y="168" font-size="14" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">x_c = Σ(m_i·x_i) / Σ m_i</text><text x="536" y="194" font-size="14" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">y_c = Σ(m_i·y_i) / Σ m_i</text><text x="536" y="220" font-size="14" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">z_c = Σ(m_i·z_i) / Σ m_i</text><text x="536" y="246" font-size="14" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">I_zz = Σ m_i·(x_i²+y_i²)</text><text x="536" y="272" font-size="14" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">I_xx = Σ m_i·(y_i²+z_i²)</text><text x="536" y="298" font-size="14" fill="#2563eb" text-anchor="start" font-family="Noto Sans SC">I_yy = Σ m_i·(x_i²+z_i²)</text><rect x="24.0" y="436.0" width="752.0" height="68.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="36" y="464" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">每个部件都要：称质量（电子秤 ±2 g）+ 量几何中心三维坐标（相对原点，±2 mm）。配重块、螺丝包也别漏。</text><text x="36" y="486" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">算完用四轮静态载荷比交叉验证（图5）；悬吊法实测校验质心高度（图12）。</text></svg>