 height="80.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="5"/><line x1="446.0" y1="307.0" x2="464.0" y2="323.0" stroke="#334155" stroke-width="1.3"/><line x1="446.0" y1="322.0" x2="464.0" y2="338.0" stroke="#334155" stroke-width="1.3"/><line x1="446.0" y1="337.0" x2="464.0" y2="353.0" stroke="#334155" stroke-width="1.3"/><circle cx="455.0" cy="330.0" r="3.0" fill="#334155" stroke="#334155" stroke-width="1"/><line x1="340.0" y1="250.0" x2="340.0" y2="93.0" stroke="#2563eb" stroke-width="2.5"/><polygon points="340.0,84.0 336.0,93.0 344.0,93.0" fill="#2563eb"/><text x="350" y="100" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">X 正方向（前进）</text><line x1="340.0" y1="250.0" x2="173.0" y2="250.0" stroke="#2563eb" stroke-width="2.5"/><polygon points="164.0,250.0 173.0,254.0 173.0,246.0" fill="#2563eb"/><text x="180" y="242" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">Y 正方向（向左）</text><circle cx="340.0" cy="250.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><circle cx="340.0" cy="250.0" r="40.0" fill="none" stroke="#2563eb" stroke-width="1.4"/><line x1="350.0" y1="210.0" x2="339.0" y2="210.0" stroke="#2563eb" stroke-width="1.8"/><polygon points="330.0,210.0 339.0,214.0 339.0,206.0" fill="#2563eb"/><text x="492" y="246" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">ω 正方向（俯视逆时针为正）</text><circle cx="180.0" cy="166.0" r="9.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="166" y="171" font-size="14" fill="#dc2626" text-anchor="end" font-weight="bold" font-family="Noto Sans SC">1 = 左前</text><circle cx="500.0" cy="166.0" r="9.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="514" y="171" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">2 = 右前</text><circle cx="180.0" cy="326.0" r="9.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="166" y="331" font-size="14" fill="#dc2626" text-anchor="end" font-weight="bold" font-family="Noto Sans SC">3 = 左后</text><circle cx="500.0" cy="326.0" r="9.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="514" y="331" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">4 = 右后</text><rect x="24.0" y="414.0" width="752.0" height="68.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="36" y="442" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">建议：轮序 1=左前、2=右前、3=左后、4=右后，定好后立刻在车身贴标签并拍照，之后全程不许更改。</text><text x="36" y="464" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">车体原点建议取「四个轮轴心连线矩形」的中心；X 沿前进方向，Y 向左，俯视逆时针为 ω 正方向（右手系）。</text></svg>