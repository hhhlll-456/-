<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">B/C组 · 电机安装精度检查</text><text x="776" y="34" font-size="13" fill="#6b7280" text-anchor="end" font-family="Noto Sans SC">对应清单条目 #23、#38 – #40</text><line x1="24.0" y1="46.0" x2="776.0" y2="46.0" stroke="#e5e7eb" stroke-width="1.5"/><text x="40" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">① 轮轴 ⊥ 底盘？（后视）</text><rect x="70.0" y="170.0" width="240.0" height="14.0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><line x1="240.0" y1="184.0" x2="240.0" y2="330.0" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/><text x="250" y="338" font-size="12" fill="#334155" text-anchor="start" font-family="Noto Sans SC">轮轴延长线</text><rect x="224.0" y="184.0" width="32.0" height="90.0" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="286" y="240" font-size="13" fill="#334155" text-anchor="start" font-family="Noto Sans SC">电机</text><rect x="210.0" y="274.0" width="60.0" height="44.0" fill="#ffffff" stroke="#334155" stroke-width="2" rx="6"/><text x="240" y="344" font-size="12" fill="#334155" text-anchor="middle" font-family="Noto Sans SC">轮</text><line x1="120.0" y1="170.0" x2="120.0" y2="330.0" stroke="#9ca3af" stroke-width="3"/><text x="60" y="152" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">角尺</text><text x="194" y="166" font-size="12" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">底盘板</text><line x1="150.0" y1="225.0" x2="197.7" y2="259.7" stroke="#dc2626" stroke-width="1.8"/><polygon points="205.0,265.0 200.1,256.5 195.4,262.9" fill="#dc2626"/><text x="60" y="252" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">θ ≤ 1°</text><text x="40" y="392" font-size="13" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">把角尺一边贴底盘面、一边贴轮轴，看缝隙；左右四个轮子都要查。</text><text x="430" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Noto Sans SC">② 轮子跳动（端面视图）</text><circle cx="590.0" cy="240.0" r="80.0" fill="#f8fafc" stroke="#334155" stroke-width="2"/><circle cx="590.0" cy="240.0" r="28.0" fill="#e5e7eb" stroke="#334155" stroke-width="1.5"/><line x1="590.0" y1="240.0" x2="590.0" y2="120.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/><text x="590" y="110" font-size="13" fill="#2563eb" text-anchor="middle" font-family="Noto Sans SC">径向跳动 ≤ 0.5 mm</text><rect x="690.0" y="196.0" width="26.0" height="44.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><line x1="690.0" y1="218.0" x2="666.0" y2="218.0" stroke="#334155" stroke-width="2"/><text x="726" y="214" font-size="12" fill="#334155" text-anchor="start" font-family="Noto Sans SC">千分表</text><text x="726" y="236" font-size="11" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">(可用目测)</text><text x="430" y="392" font-size="13" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">手转轮子一整圈看表针摆动（径向/端面都要测）。</text><text x="430" y="410" font-size="13" fill="#6b7280" text-anchor="start" font-family="Noto Sans SC">同时确认：轮子与轴固定可靠、不打滑（顶丝/D轴/夹紧）。</text><rect x="24.0" y="420.0" width="752.0" height="46.0" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2" rx="8"/><text x="36" y="448" font-size="14" fill="#1f2937" text-anchor="start" font-family="Noto Sans SC">③ 电机安装座与轮心的同轴/偏斜偏差：目视 + 直尺，±0.5 mm。任何一项超标，先修机械再谈 PID。</text></svg>